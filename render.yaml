services:
  # Backend API Web Service (FastAPI)
  - type: web
    name: aegis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: aegis-frontend
          property: host
      # Optional: set DATABASE_URL in Render dashboard to override default
      # For Persistent Disk SQLite: sqlite:////data/aegis.db
      # For Managed PostgreSQL: postgresql://user:password@host/dbname
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: aegis-data
      mountPath: /data
      sizeGB: 1

  # Frontend Web Service (Vite React SPA Static Site)
  - type: web
    name: aegis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aegis-backend
          property: host
